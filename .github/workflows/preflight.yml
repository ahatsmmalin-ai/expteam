name: ExpertTeam - corporate preflight (no deployment)
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  static-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Dependencies
        run: pip install -r requirements.txt
      - name: CMS data validation
        run: python scripts/content_integrity.py
      - name: Staging build - non-indexable
        run: python build.py
      - name: Links and SEO smoke test
        run: python scripts/qa_check.py
      - name: Simulate edit + new page + publication safety
        run: python scripts/cms_smoke_test.py
      - name: Refuse production deployment without approvals
        run: |
          if python build.py --production; then
            echo 'Unexpected production build without release approval' >&2
            exit 1
          else
            echo 'Production is correctly blocked until release signoff.'
          fi
      # Intentionally no deployment or repository publishing step.
