name: ExpertTeam 2026 redesign - staging QA
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  static-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Stage build (noindex)
        run: python build.py
      - name: QA for pages, SEO, graphics and links
        run: python scripts/redesign_qa.py
      - name: Simulate CMS content changes
        run: python scripts/redesign_cms_smoke.py
      - name: Confirm production release gate
        run: |
          if python build.py --production; then
            echo 'Unexpected production build without approval' >&2
            exit 1
          else
            echo 'Production build correctly blocked pending signoff.'
          fi
