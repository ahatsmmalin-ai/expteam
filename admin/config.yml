- name: new_posts
  label: 07. Новые статьи
  label_singular: Статья
  folder: content/cms_posts
  create: true
  format: frontmatter
  extension: md
  slug: '{{fields.slug}}'
  preview_path: blog/{{fields.slug}}/
  identifier_field: title
  fields:
  - label: Заголовок статьи
    name: title
    widget: string
  - label: URL-слаг латиницей
    name: slug
    widget: string
    pattern:
    - ^[a-z0-9]+(?:-[a-z0-9]+)*$
    - Только a-z, 0-9 и дефисы
  - label: SEO Description
    name: description
    widget: text
  - label: Рубрика
    name: category
    widget: select
    options:
    - Маркетинг
    - Лидогенерация
    - CRM
    - Реклама
    - Сайты
    - SEO
  - label: Автор
    name: author
    widget: string
    default: Редакция Expert Team
  - label: Обложка
    name: cover_image
    widget: image
    required: false
  - label: Alt обложки
    name: image_alt
    widget: string
    required: false
  - label: Текст статьи
