# Expert Team CMS — GitHub OAuth through Cloudflare Pages Functions.
backend:
  name: github
  repo: ahatsmmalin-ai/expteam
  branch: main
  base_url: https://expteam-staging.pages.dev
  auth_endpoint: /api/auth
  site_domain: expteam-staging.pages.dev
publish_mode: editorial_workflow
site_url: https://expteam-staging.pages.dev
display_url: https://expteam-staging.pages.dev
logo_url: /assets/favicon.svg
media_folder: assets/uploads
public_folder: /assets/uploads
locale: ru
editor:
  preview: false
collections:
- name: settings
  label: 00. Общие настройки
  files:
  - name: global
    label: Меню, подвал и формы
    file: content/global.json
    format: json
    fields:
    - label: Общие тексты
      name: entries
      widget: list
      collapsed: true
      allow_add: false
      allow_delete: false
      sortable: false
      summary: '{{fields.label}}'
      fields:
      - label: ID
        name: id
        widget: hidden
      - label: Название
        name: label
        widget: hidden
      - &id001
        label: Текст
        name: value
        widget: text
        required: false
        hint: Редактируйте формулировку. Верстка, цвет и ссылка не изменятся.
  - name: media
    label: Логотип, фото команды, письма, кейсы
    file: content/media.json
    format: json
    fields:
    - label: Оригинальный логотип
      name: logo
      widget: image
      required: false
    - label: Команда
      name: team
      widget: list
      allow_add: false
      allow_delete: false
      sortable: false
      fields:
      - label: Роль
        name: role
        widget: string
      - label: ФИО (после подтверждения)
        name: name
        widget: string
        required: false
      - label: Фотография
        name: photo
        widget: image
        required: false
    - label: Благодарственные письма (только настоящие сканы)
      name: letters
      widget: list
      allow_add: true
      sortable: false
      fields:
      - label: Компания
        name: company
        widget: string
      - label: Скан письма
        name: scan
        widget: image
        required: false
      - label: Подпись к изображению
        name: alt
        widget: string
        required: false
      - label: Разрешено показывать
        name: approved
        widget: boolean
        default: false
    - label: Кейсы / обложки
      name: case_images
      widget: object
      collapsed: true
      fields:
      - label: gorodskoj-evakuator
        name: gorodskoj-evakuator
        widget: image
        required: false
      - label: astra
        name: astra
        widget: image
        required: false
      - label: kredit-partner
        name: kredit-partner
        widget: image
        required: false
      - label: mfc-moya-ipoteka
        name: mfc-moya-ipoteka
        widget: image
        required: false
      - label: plexpoint
        name: plexpoint
        widget: image
        required: false
      - label: europack
        name: europack
        widget: image
        required: false
      - label: razdolye-konsalt
        name: razdolye-konsalt
        widget: image
        required: false
      - label: homeoffice
        name: homeoffice
        widget: image
        required: false
      - label: cinemarental
        name: cinemarental
        widget: image
        required: false
    - label: Скриншоты по кейсам
      name: case_screenshots
      widget: object
      collapsed: true
      fields:
      - label: gorodskoj-evakuator
        name: gorodskoj-evakuator
        widget: list
        required: false
        field:
          label: Изображение
          name: image
          widget: image
      - label: astra
        name: astra
        widget: list
        required: false
        field:
          label: Изображение
          name: image
          widget: image
      - label: kredit-partner
        name: kredit-partner
        widget: list
        required: false
        field:
          label: Изображение
          name: image
          widget: image
      - label: mfc-moya-ipoteka
        name: mfc-moya-ipoteka
        widget: list
        required: false
        field:
          label: Изображение
          name: image
          widget: image
      - label: plexpoint
        name: plexpoint
        widget: list
        required: false
        field:
          label: Изображение
          name: image
          widget: image
      - label: europack
        name: europack
        widget: list
        required: false
        field:
          label: Изображение
          name: image
          widget: image
      - label: razdolye-konsalt
        name: razdolye-konsalt
        widget: list
        required: false
        field:
          label: Изображение
          name: image
          widget: image
      - label: homeoffice
        name: homeoffice
        widget: list
        required: false
        field:
          label: Изображение
          name: image
          widget: image
      - label: cinemarental
        name: cinemarental
        widget: list
        required: false
        field:
          label: Изображение
          name: image
          widget: image
    - label: Реальный пример маркетинговой презентации
      name: plan_preview
      widget: image
      required: false
    - label: Реальный пример отчёта или таблицы
      name: report_preview
      widget: image
      required: false
  - name: navigation
    label: Дополнительные ссылки в меню
    file: content/navigation.json
    format: json
    fields:
    - name: links
      label: Дополнительные пункты меню
      widget: list
      required: false
      fields:
      - label: Название
        name: title
        widget: string
      - label: Путь на сайте (например, stranicy/primer/index.html)
        name: path
        widget: string
        hint: Без https://, путь относительно корня сайта
