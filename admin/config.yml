# CMS authorization is NOT enabled. Configure a real OAuth gateway before changing cms_auth_ready.
backend:
  name: github
  repo: ahatsmmalin-ai/expteam
  branch: main
  squash_merges: true
publish_mode: editorial_workflow
media_folder: static/uploads
public_folder: /assets/uploads
locale: ru
cms_auth_ready: false
site_url: https://expteam-staging.pages.dev
display_url: https://expteam-staging.pages.dev
collections:
- name: settings
  label: Настройки / основные данные
  files:
  - name: site
    label: Глобальные данные и логотип
    file: content/site.json
    format: json
    fields:
    - label: Бренд
      name: brand
      widget: string
    - label: Домен (production)
      name: domain
      widget: string
    - label: Email
      name: email
      widget: string
    - label: Telegram
      name: telegram
      widget: string
    - label: Телефон
      name: phone
      widget: string
      required: false
    - label: ИНН
      name: inn
      widget: string
    - label: Год основания
      name: founded
      widget: string
    - label: Логотип — оригинальный файл SVG/PNG
      name: logo_image
      widget: image
      required: false
    - label: Текст о компании
      name: about
      widget: text
      required: false
    - label: Подпись на главной
      name: hero_foot
      widget: string
      required: false
    - label: Текст формы
      name: form_description
      widget: text
      required: false
    - label: Заголовок формы
      name: form_title
      widget: string
      required: false
    - label: Подтверждённая цена
      name: price_confirmed
      widget: string
  - name: redesign
    label: Главная / решения / FAQ
    file: content/redesign.json
    format: json
    fields:
    - label: Основной H1
      name: hero_title
      widget: string
    - label: 'Первый экран: описание'
      name: hero_sub
      widget: text
    - label: 'Первый экран: факты'
      name: hero_note
      widget: string
    - label: Текст первой кнопки
      name: primary_cta
      widget: string
    - label: Описание бесплатного плана
      name: plan_intro
      widget: text
    - label: Комплекс работ
      name: scope
      widget: list
      fields:
      - label: Название
        name: title
        widget: string
      - label: Описание
        name: description
        widget: text
      - label: Иконка из ZIP (01–39)
        name: icon
        widget: number
        value_type: int
        min: 1
        max: 39
    - label: Операционные задачи
      name: operations
      widget: list
      field:
        label: Задача
        name: item
        widget: string
    - label: Вопросы главной
      name: home_faq
      widget: list
      fields:
      - label: Вопрос
        name: q
        widget: string
      - label: Ответ
        name: a
        widget: text
    - label: Три решения
      name: solutions
      widget: list
      fields:
      - label: Слаг
        name: slug
        widget: string
      - label: Метка
        name: label
        widget: string
      - label: Название
        name: name
        widget: string
      - label: Оффер / H1
        name: headline
        widget: string
      - label: Введение
        name: intro
        widget: text
      - label: Цена
        name: price
        widget: string
      - label: Кнопка
        name: cta
        widget: string
      - label: Иконка (01–39)
        name: icon
        widget: number
        value_type: int
        min: 1
        max: 39
      - label: Этапы работ
        name: steps
        widget: list
        fields:
        - label: Название этапа
          name: title
          widget: string
        - label: Описание этапа
          name: description
          widget: text
      - label: FAQ решения
        name: faqs
        widget: list
        fields:
        - label: Вопрос
          name: q
          widget: string
        - label: Ответ
          name: a
          widget: text
  - name: cases
    label: Каталог кейсов (9+)
    file: content/redesign_cases.json
    format: json
    fields:
    - label: Кейсы
      name: items
      widget: list
      fields:
      - label: URL-слаг
        name: slug
        widget: string
      - label: Компания
        name: name
        widget: string
      - label: Отрасль
        name: sector
        widget: string
      - label: Фильтр отрасли
        name: category
        widget: select
        options:
        - label: Производство
          value: manufacturing
        - label: Услуги
          value: services
        - label: IT
          value: it
      - label: Крупный показатель
        name: metric
        widget: string
      - label: Подпись к показателю
        name: metric_caption
        widget: string
      - label: Описание
        name: intro
        widget: text
      - label: Что сделали
        name: work
        widget: list
        field:
          label: Действие
          name: item
          widget: string
      - label: Итог
        name: result
        widget: text
      - label: Период
        name: period
        widget: string
      - label: Иконка из ZIP
        name: icon
        widget: number
        value_type: int
        min: 1
        max: 39
      - label: Статус подтверждения
        name: status
        widget: select
        options:
        - needs_approval
        - approved
      - label: Скриншоты и подтверждающие материалы
        name: screenshots
        widget: list
        field:
          label: Изображение
          name: image
          widget: image
        required: false
  - name: letters
    label: Настоящие благодарственные письма
    file: content/letters.json
    format: json
    fields:
    - label: Письма
      name: items
      widget: list
      fields:
      - label: Клиент
        name: name
        widget: string
      - label: Скан письма
        name: image
        widget: image
        required: false
      - label: Alt-текст
        name: image_alt
        widget: string
        required: false
      - label: Согласовано к публикации
        name: approved
        widget: boolean
        default: false
  - name: team
    label: Реальные фотографии команды
    file: content/team.json
    format: json
    fields:
    - label: Участники/роли
      name: items
      widget: list
      fields:
      - label: Роль
        name: role
        widget: string
      - label: Реальное имя
        name: name
        widget: string
        required: false
      - label: Должность и задачи
        name: description
        widget: text
      - label: Метка роли
        name: label
        widget: string
      - label: Временная иконка из ZIP
        name: icon
        widget: number
        value_type: int
        min: 1
        max: 39
      - label: Фото при наличии согласия
        name: photo
        widget: image
        required: false
- name: articles
  label: Блог / SEO-статьи
  folder: content/posts
  create: true
  format: frontmatter
  extension: md
  slug: '{{fields.slug}}'
  identifier_field: title
  summary: '{{title}} — {{category}} — {{editorial_status}}'
  preview_path: blog/{{fields.slug}}/
  fields:
  - label: Заголовок H1
    name: title
    widget: string
  - label: URL-слаг
    name: slug
    widget: string
  - label: Рубрика
    name: category
    widget: select
    options:
    - label: Маркетинг
      value: marketing
    - label: Лидогенерация
      value: lidogeneraciya
    - label: Реклама
      value: reklama
    - label: Сайты
      value: sajty
    - label: CRM
      value: crm
    - label: SEO
      value: seo
  - label: Главный запрос
    name: keyword
    widget: string
  - label: SEO description
    name: description
    widget: text
  - label: Автор
    name: author
    widget: string
  - label: Роль автора
    name: author_role
    widget: string
    required: false
  - label: Биография автора
    name: author_bio
    widget: text
    required: false
  - label: Обложка
    name: cover_image
    widget: image
    required: false
  - label: Alt
    name: image_alt
    widget: string
    required: false
  - label: Статус
    name: editorial_status
    widget: select
    options:
    - draft
    - factcheck
    - approved
    default: draft
  - label: Кто проверил
    name: reviewed_by
    widget: string
    required: false
  - label: Когда проверили
    name: reviewed_on
    widget: datetime
    required: false
    date_format: YYYY-MM-DD
    time_format: false
    format: YYYY-MM-DD
  - label: Источники
    name: source_notes
    widget: text
    required: false
  - label: Опубликовано
    name: published
    widget: boolean
    default: false
  - label: Дата
    name: date
    widget: datetime
    date_format: YYYY-MM-DD
    time_format: false
    format: YYYY-MM-DD
  - label: Обновление
    name: modified
    widget: datetime
    date_format: YYYY-MM-DD
    time_format: false
    format: YYYY-MM-DD
  - label: Связанные услуги (legacy)
    name: related_services
    widget: list
    field:
      label: Слаг
      name: slug
      widget: string
    required: false
  - label: Текст статьи
    name: body
    widget: markdown
  - label: Отметка редактора
    name: review_note
    widget: text
    required: false
- name: pages
  label: Новые страницы
  folder: content/pages
  create: true
  format: frontmatter
  extension: md
  slug: '{{fields.slug}}'
  identifier_field: title
  preview_path: '{{fields.section}}/{{fields.slug}}/'
  fields:
  - label: Название
    name: title
    widget: string
  - label: Слаг латиницей
    name: slug
    widget: string
  - label: Раздел
    name: section
    widget: select
    options:
    - stranicy
    - materialy
    - resheniya
  - label: SEO Title
    name: seo_title
    widget: string
  - label: SEO Description
    name: description
    widget: text
  - label: H1
    name: h1
    widget: string
  - label: Лид
    name: intro
    widget: text
  - label: Обложка
    name: cover_image
    widget: image
    required: false
  - label: Alt обложки
    name: image_alt
    widget: string
    required: false
  - label: Редакционный статус
    name: editorial_status
    widget: select
    options:
    - draft
    - factcheck
    - approved
    default: draft
  - label: Утвердил
    name: reviewed_by
    widget: string
    required: false
  - label: Дата утверждения
    name: reviewed_on
    widget: string
    required: false
  - label: Основания
    name: source_notes
    widget: text
    required: false
  - label: Опубликовано
    name: published
    widget: boolean
    default: false
  - label: Основной текст
    name: body
    widget: markdown
