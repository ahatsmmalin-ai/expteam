# Safety: only non-indexable staging builds are automatic. Production needs an approved manual release.
[build]
  command = "pip install -r requirements.txt && python scripts/content_integrity.py && python build.py && python scripts/qa_check.py"
  publish = "dist"

[[redirects]]
  from = "/404"
  to = "/404.html"
  status = 301

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

[build.environment]
  PYTHON_VERSION = "3.12"
