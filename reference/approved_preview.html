rent=\"page\">Настройка рекламы<\/span><\/nav><div class=\"service-hero-head\"><p class=\"eyebrow light\"><span class=\"dot\"><\/span> 04 / 07 — ЯНДЕКС.ДИРЕКТ / VK / РАССЫЛКИ<\/p><div class=\"service-hero-index\">04<\/div><h1>Настройка и ведение рекламы — от запуска до результата<\/h1><\/div><div class=\"service-hero-bottom\"><p>Помогаем находить покупателей в поиске, рекламных сетях и социальных платформах. Не ограничиваемся кликами: смотрим, что происходит после обращения.<\/p><div><button class=\"btn btn-acid btn-big\" data-open-lead=\"\">Получить маркетинговый план ↗<\/button><small>Медиаплан после аудита · Подробности после диагностики<\/small><\/div><\/div><div class=\"service-tags\"><span>СТРАТЕГИЯ<\/span><span>УПРАВЛЕНИЕ<\/span><span>АНАЛИТИКА<\/span><span>РЕЗУЛЬТАТ<\/span><\/div><\/div><\/div>\n<section class=\"section service-audience\"><div class=\"container\"><div class=\"section-head\"><div class=\"eyebrow\"><span class=\"dot\"><\/span> 01 / КОМУ ПОДХОДИТ<\/div><div><h2>Когда это\nименно ваша задача.<\/h2><p>Мы смотрим на ситуацию и бизнес-модель, а не подбираем услугу по шаблону.<\/p><\/div><\/div><div class=\"audience-grid\"><article><span class=\"tiny-index\">01<\/span><h3>Локальные услуги<\/h3><p>Важна стоимость обращения в конкретном городе и географии.<\/p><\/article><article><span class=\"tiny-index\">02<\/span><h3>B2B<\/h3><p>Работаем с узкой аудиторией и длинным циклом сделки.<\/p><\/article><article><span class=\"tiny-index\">03<\/span><h3>Интернет-продажи<\/h3><p>Нужны каталог, аналитика целей и повторные касания.<\/p><\/article><article><span class=\"tiny-index\">04<\/span><h3>Новый продукт<\/h3><p>Тестируем спрос малыми итерациями до масштабирования.<\/p><\/article><\/div><\/div><\/section>\n<section class=\"section service-inside\"><div class=\"container\"><div class=\"section-head\"><div class=\"eyebrow\"><span class=\"dot\"><\/span> 02 / ЧТО ВХОДИТ<\/div><div><h2>Всё нужное.\nНичего лишнего.<\/h2><p>Фактический состав и границы работ фиксируем в коммерческом предложении.<\/p><\/div><\/div><div class=\"inside-grid\"><article class=\"inside-item\"><span>01<\/span><h3>Яндекс.Директ<\/h3><p>Поисковые и сетевые кампании, семантика, объявления, минус-слова и оптимизация.<\/p><div class=\"inside-cross\">↗<\/div><\/article><article class=\"inside-item\"><span>02<\/span><h3>VK Реклама<\/h3><p>Сегменты аудитории, тестирование креативов, воронки заявок и ретаргетинг.<\/p><div class=\"inside-cross\">↗<\/div><\/article><article class=\"inside-item\"><span>03<\/span><h3>Аудит рекламы<\/h3><p>Проверяем структуру кабинета, события, ставки, качество трафика и страницы.<\/p><div class=\"inside-cross\">↗<\/div><\/article><article class=\"inside-item\"><span>04<\/span><h3>Креативы и офферы<\/h3><p>Разрабатываем гипотезы заголовков, изображений и посадочных страниц.<\/p><div class=\"inside-cross\">↗<\/div><\/article><article class=\"inside-item\"><span>05<\/span><h3>Рассылки<\/h3><p>Проектируем законные и согласованные сценарии email и SMS-коммуникаций.<\/p><div class=\"inside-cross\">↗<\/div><\/article><article class=\"inside-item\"><span>06<\/span><h3>Аналитика и отчёты<\/h3><p>Измеряем обращения и продажи в связке с CRM, корректируем бюджет по фактам.<\/p><div class=\"inside-cross\">↗<\/div><\/article><\/div><\/div><\/section>\n<section class=\"section dark-section\"><div class=\"container\"><div class=\"section-head\"><div class=\"eyebrow light\"><span class=\"dot\"><\/span> 03 / КАК РАБОТАЕМ<\/div><div><h2>От первой встречи<br/>до регулярной работы.<\/h2><p>Не прячем процесс за сложными терминами.<\/p><\/div><\/div><div class=\"timeline\"><div class=\"timeline-item\"><span>ШАГ 1<\/span><div><h3>Аудит<\/h3><p>Проверяем оффер, спрос, сайт, метрики и экономику.<\/p><\/div><span>↗<\/span><\/div><div class=\"timeline-item\"><span>ШАГ 2<\/span><div><h3>Структура<\/h3><p>Собираем семантику и аудитории, делаем медиаплан.<\/p><\/div><span>↗<\/span><\/div><div class=\"timeline-item\"><span>ШАГ 3<\/span><div><h3>Запуск<\/h3><p>Настраиваем события, кампании и проверяем корректность данных.<\/p><\/div><span>↗<\/span><\/div><div class=\"timeline-item\"><span>ШАГ 4<\/span><div><h3>Оптимизация<\/h3><p>Отключаем неэффективное и усиливаем работающие связки.<\/p><\/div><span>↗<\/span><\/div><\/div><div class=\"tools-row\"><strong>ТЕХНОЛОГИИ И ИНСТРУМЕНТЫ<\/strong><div><span>Яндекс.Директ<\/span><span>VK Реклама<\/span><span>Яндекс.Метрика<\/span><span>UTM-метки<\/span><span>CRM<\/span><span>Коллтрекинг<\/span><\/div><\/div><\/div><\/section>\n<section class=\"section service-meaning\"><div class=\"container\"><div class=\"meaning-quote\"><div class=\"asterisk\">✳<\/div><div><span class=\"eyebrow\">НАШ ПОДХОД<\/span><p>«Реклама начинается не с кнопки «Запустить», а с понимания, какую сделку мы хотим получить.»<\/p><\/div><\/div><div class=\"meaning-columns\"><div><p class=\"eyebrow\">КАК МЫ ОЦЕНИВАЕМ РЕЗУЛЬТАТ<\/p><h2>Не только<br/>охват и клики.<\/h2><\/div><div><p>Согласуем измеримые показатели ещё до начала работ: стоимость и качество обращений, динамика конверсии, объём квалифицированного спроса, вклад в продажи и прозрачность процессов. Метрики зависят от услуги, доступных данных и этапа развития проекта.<\/p><p>Если данные о продажах пока не передаются в аналитику, сначала устраняем этот пробел. Отчёты должны помогать принимать решения, а не просто выглядеть красиво.<\/p><\/div><\/div><\/div><\/section>\n<section class=\"section service-guides\"><div class=\"container\"><div class=\"section-head\"><div class=\"eyebrow\"><span class=\"dot\"><\/span> 04 / ПОДРОБНО ОБ УСЛУГЕ<\/div><div><h2>Разбираем инструменты\nи задачи бизнеса.<\/h2><p>Отвечаем на основные поисковые запросы без механического повторения ключевых слов.<\/p><\/div><\/div><div class=\"guide-grid\"><article class=\"guide-card\"><span>01 / НАПРАВЛЕНИЕ<\/span><h2>Настройка Яндекс.Директа<\/h2><p>Качественная настройка контекстной рекламы начинается с семантики, минус-слов, структуры кампаний и проверенной посадочной страницы. Затем задаём измеримые цели и аккуратно тестируем группы запросов. Отдельно оцениваем поиск и рекламные сети: у них разные аудитории и ожидания. После запуска анализируем поисковые фразы, конверсии, качество лидов и расходы, не делая выводов по одному дню данных.<\/p><\/article><article class=\"guide-card\"><span>02 / НАПРАВЛЕНИЕ<\/span><h2>Таргетированная реклама ВКонтакте<\/h2><p>Для VK Рекламы важно выстроить сильный оффер и подобрать креативы, понятные аудитории с первого взгляда. Тестируем сегменты, форматы и целевые действия: переход на сайт, обращение в сообщения или форму. При B2B-продвижении особое внимание уделяем качеству обращений и передаче данных в CRM. Даже низкая цена заявки не считается успехом, если продажи не видят потенциальных клиентов.<\/p><\/article><article class=\"guide-card\"><span>03 / НАПРАВЛЕНИЕ<\/span><h2>SMS и email-рассылки для бизнеса<\/h2><p>Рассылки по базе клиентов могут поддерживать повторные покупки и информировать о полезных обновлениях. Перед запуском проверяем актуальность контактов и законные основания получения рекламных сообщений. Далее сегментируем аудиторию, подбираем частоту, содержание и возможность отказа. Эффективность оцениваем по полезным действиям, отпискам, жалобам и подтверждённым продажам.<\/p><\/article><article class=\"guide-card\"><span>04 / НАПРАВЛЕНИЕ<\/span><h2>Как снизить расходы на рекламу<\/h2><p>Экономия часто начинается не со снижения ставок, а с поиска потерь в воронке: слабые объявления, нерелевантные запросы, неудобные формы, задержка ответа менеджера. Для каждого возможного узкого места нужна проверяемая гипотеза. Если каналы уже эффективны, чрезмерное урезание бюджета может снизить суммарный объём заявок.<\/p><\/article><\/div><\/div><\/section>\n<section class=\"section service-proof\"><div class=\"container\"><div class=\"section-head\"><div class=\"eyebrow\"><span class=\"dot\"><\/span> 04 / ОПЫТ<\/div><div><h2>Реальный бизнес.\nРеальные задачи.<\/h2><p>Примеры из кейсов, опубликованных Expert Team на действующем сайте.<\/p><\/div><\/div><div class=\"service-case\"><div class=\"service-case-index\">ET / CASE 01<\/div><div><small>Финансовые услуги · B2B<\/small><h3>МФЦ «Моя Ипотека»<\/h3><p>С нуля выстроили маркетинг для привлечения целевых B2B-обращений в рамках согласованной стоимости лида.<\/p><a class=\"underlink\" href=\"/kejsy/mfc-moya-ipoteka/\">Подробнее о кейсе ↗<\/a><\/div><div class=\"service-case-metric\"><strong>≤ 450 ₽<\/strong><span>стоимость лида, указанная в кейсе<\/span><\/div><\/div><div class=\"service-price\"><div><span class=\"eyebrow\">ЦЕНА / ФОРМАТ<\/span><h2>Медиаплан после аудита<\/h2><p>Подготовим оценку объёма работ и бюджета после короткого знакомства с задачей. Никаких скрытых обещаний и неутверждённых тарифов.<\/p><\/div><div><a class=\"underlink\" href=\"/ceny/\">Как формируется стоимость ↗<\/a><button class=\"btn btn-dark\" data-open-lead=\"\">Обсудить стоимость ↗<\/button><\/div><\/div><section class=\"lead-section\" id=\"lead-section\"><div aria-hidden=\"true\" class=\"lead-pattern\">✳<\/div><div class=\"lead-section-copy\"><p class=\"eyebrow\">БЕСПЛАТНО / БЕЗ ОБЯЗАТЕЛЬСТВ<\/p><h2>План роста<br/><em>вместо догадок.<\/em><\/h2><p>Разберём вашу задачу, покажем точки роста и предложим реалистичный план работ. Без обязательств на старте.<\/p><\/div><form class=\"lead-form lead-form-inline\" data-lead-form=\"\"><label class=\"sr-only\" for=\"leadPhone\">Номер телефона<\/label><div class=\"lead-inline-row\"><input autocomplete=\"tel\" id=\"leadPhone\" inputmode=\"tel\" maxlength=\"30\" minlength=\"8\" name=\"phone\" placeholder=\"Ваш номер телефона\" required=\"\" type=\"tel\"/><button class=\"btn btn-dark\" type=\"submit\">Получить план ↗<\/button><\/div><label class=\"checkline\"><input name=\"consent\" required=\"\" type=\"checkbox\"/><span>Согласен(а) на обработку персональных данных по <a href=\"/politika-konfidencialnosti/\">политике<\/a><\/span><\/label><p aria-live=\"polite\" class=\"form-status\" role=\"status\"><\/p><\/form><\/section><\/div><\/section>\n<section class=\"section faq-section\"><div class=\"container\"><div class=\"faq-columns\"><div><p class=\"eyebrow\"><span class=\"dot\"><\/span> 05 / FAQ<\/p><h2>Разбираем<br/><em>детали.<\/em><\/h2><p>Честно о формате работы, процессе и сроках.<\/p><\/div><div class=\"faq-list\"><details class=\"faq-item\"><summary><span class=\"faq-index\">01<\/span><span>Сколько стоит настройка рекламы?<\/span><span class=\"faq-plus\">+<\/span><\/summary><div class=\"faq-answer\">Стоимость зависит от количества площадок, сложности кампаний, креативов и ведения. Смету и рекламный бюджет показываем отдельно.<\/div><\/details><details class=\"faq-item\"><summary><span class=\"faq-index\">02<\/span><span>Что выбрать — Яндекс.Директ или ВКонтакте?<\/span><span class=\"faq-plus\">+<\/span><\/summary><div class=\"faq-answer\">Зависит от сформированности спроса и аудитории. Поисковая реклама отвечает на существующий запрос, таргет помогает находить и прогревать сегменты.<\/div><\/details><details class=\"faq-item\"><summary><span class=\"faq-index\">03<\/span><span>Вы ведёте рекламу после запуска?<\/span><span class=\"faq-plus\">+<\/span><\/summary><div class=\"faq-answer\">Да, постоянная оптимизация и отчёты — отдельная часть работы.<\/div><\/details><details class=\"faq-item\"><summary><span class=\"faq-index\">04<\/span><span>Можно ли использовать текущий рекламный кабинет?<\/span><span class=\"faq-plus\">+<\/span><\/summary><div class=\"faq-answer\">Да. Проводим аудит доступа, целей и структуры, затем предлагаем план изменений.<\/div><\/details><details class=\"faq-item\"><summary><span class=\"faq-index\">05<\/span><span>Занимаетесь ли вы рассылками?<\/span><span class=\"faq-plus\">+<\/span><\/summary><div class=\"faq-answer\">Да, при наличии законного основания для обработки контактов и получения рекламных сообщений.<\/div><\/details><details class=\"faq-item\"><summary><span class=\"faq-index\">06<\/span><span>Как отслеживать заявки?<\/span><span class=\"faq-plus\">+<\/span><\/summary><div class=\"faq-answer\">Настраиваем цели на сайте, метки, события и передачу данных в CRM по возможности.<\/div><\/details><\/div><\/div><\/div><\/section>\n<section class=\"section related-section\"><div class=\"container\"><div class=\"section-head\"><div class=\"eyebrow\"><span class=\"dot\"><\/span> 06 / СМЕЖНЫЕ РЕШЕНИЯ<\/div><div><h2>Усилим результат\nдругими инструментами.<\/h2><\/div><\/div><div class=\"related-grid\"><a href=\"/uslugi/marketing-na-autsorse/\"><span>01<\/span><h3>Маркетинг на аутсорсе<\/h3><p>Внешний отдел маркетинга, который работает как ваш собственный.<\/p><b>↗<\/b><\/a><a href=\"/uslugi/sozdanie-sajtov/\"><span>02<\/span><h3>Создание сайтов<\/h3><p>Продуманные сайты и лендинги, которые превращают трафик в заявки.<\/p><b>↗<\/b><\/a><a href=\"/uslugi/lidogeneraciya/\"><span>03<\/span><h3>Лидогенерация<\/h3><p>Системно привлекаем и квалифицируем обращения для отдела продаж.<\/p><b>↗<\/b><\/a><\/div><\/div><\/section>\n<\/main>\n<footer class=\"footer\"><div class=\"container\"><div class=\"footer-top\"><div class=\"footer-lead\"><p class=\"eyebrow\">НЕ ОСТАВЛЯЙТЕ МАРКЕТИНГ НА САМОТЁК<\/p><h2>Поговорим<br/>о <em>росте?<\/em><\/h2><button class=\"btn btn-acid btn-big\" data-open-lead=\"\">Обсудить проект <span>↗<\/span><\/button><\/div><div class=\"footer-aside\"><div class=\"footer-sticker\">ЕТ<span>✳<\/span><\/div><p>Разберём, с чего начать. Без обещаний невозможного — с цифр, логики и прозрачного плана.<\/p><\/div><\/div><div class=\"footer-columns\"><div><a class=\"footer-logo\" href=\"/\">expert.team<\/a><p>Маркетинговая команда для бизнеса. Работаем с 2018 года, удалённо по всей России.<\/p><small>ИНН 743004666377<\/small><\/div><div><h3>Услуги<\/h3><a href=\"/uslugi/marketing-na-autsorse/\">Маркетинг на аутсорсе<\/a><a href=\"/uslugi/sozdanie-sajtov/\">Создание сайтов<\/a><a href=\"/uslugi/lidogeneraciya/\">Лидогенерация<\/a><a href=\"/uslugi/nastrojka-reklamy/\">Настройка рекламы<\/a><a href тегории продуктов и отраслевые задачи.<\/p><\/article><article><span class=\"tiny-index\">04<\/span><h3>Новый сайт<\/h3><p>Важно заложить SEO-архитектуру до появления большого объёма страниц.<\/p><\/article><\/div><\/div><\/section>\n<section class=\"section service-inside\"><div class=\"container\"><div class=\"section-head\"><div class=\"eyebrow\"><span class=\"dot\"><\/span> 02 / ЧТО ВХОДИТ<\/div><div><h2>Всё нужное.\nНичего лишнего.<\/h2><p>Фактический состав и границы работ фиксируем в коммерческом предложении.<\/p><\/div><\/div><div class=\"inside-grid\"><article class=\"inside-item\"><span>01<\/span><h3>SEO-аудит<\/h3><p>Проверяем индексацию, технические ошибки, скорость, ссылки и качество страниц.<\/p><div class=\"inside-cross\">↗<\/div><\/article><article class=\"inside-item\"><span>02<\/span><h3>Семантическое ядро<\/h3><p>Собираем запросы, группируем по намерению, распределяем по страницам.<\/p><div class=\"inside-cross\">↗<\/div><\/article><article class=\"inside-item\"><span>03<\/span><h3>Оптимизация структуры<\/h3><p>Устраняем каннибализацию, оформляем заголовки, метатеги и навигацию.<\/p><div class=\"inside-cross\">↗<\/div><\/article><article class=\"inside-item\"><span>04<\/span><h3>Контент-маркетинг<\/h3><p>Готовим экспертные статьи, сравнения, руководства и ответы на вопросы клиентов.<\/p><div class=\"inside-cross\">↗<\/div><\/article><article class=\"inside-item\"><span>05<\/span><h3>Техническое SEO<\/h3><p>Настраиваем sitemap, robots, canonical, микроразметку и Core Web Vitals.<\/p><div class=\"inside-cross\">↗<\/div><\/article><article class=\"inside-item\"><span>06<\/span><h3>Внутренняя и внешняя работа<\/h3><p>Развиваем перелинковку, доверие к источнику и релевантные упоминания.<\/p><div class=\"inside-cross\">↗<\/div><\/article><\/div><\/div><\/section>\n<section class=\"section dark-section\"><div class=\"container\"><div class=\"section-head\"><div class=\"eyebrow light\"><span class=\"dot\"><\/span> 03 / КАК РАБОТАЕМ<\/div><div><h2>От первой встречи<br/>до регулярной работы.<\/h2><p>Не прячем процесс за сложными терминами.<\/p><\/div><\/div><div class=\"timeline\"><div class=\"timeline-item\"><span>ШАГ 1<\/span><div><h3>Диагностика<\/h3><p>Смотрим текущее состояние, конкурентов и поисковый спрос.<\/p><\/div><span>↗<\/span><\/div><div class=\"timeline-item\"><span>ШАГ 2<\/span><div><h3>Структура<\/h3><p>Формируем карту URL и кластеры ключевых запросов.<\/p><\/div><span>↗<\/span><\/div><div class=\"timeline-item\"><span>ШАГ 3<\/span><div><h3>Оптимизация<\/h3><p>Исправляем техническое, коммерческие страницы и контент.<\/p><\/div><span>↗<\/span><\/div><div class=\"timeline-item\"><span>ШАГ 4<\/span><div><h3>Развитие<\/h3><p>Публикуем материалы, обновляем страницы и оцениваем заявки из органики.<\/p><\/div><span>↗<\/span><\/div><\/div><div class=\"tools-row\"><strong>ТЕХНОЛОГИИ И ИНСТРУМЕНТЫ<\/strong><div><span>Яндекс.Вебмастер<\/span><span>Google Search Console<\/span><span>PageSpeed Insights<\/span><span>Schema.org<\/span><span>IndexNow<\/span><span>Веб-аналитика<\/span><\/div><\/div><\/div><\/section>\n<section class=\"section service-meaning\"><div class=\"container\"><div class=\"meaning-quote\"><div class=\"asterisk\">✳<\/div><div><span class=\"eyebrow\">НАШ ПОДХОД<\/span><p>«Хорошее SEO начинается с архитектуры — не с механического повторения ключевых слов.»<\/p><\/div><\/div><div class=\"meaning-columns\"><div><p class=\"eyebrow\">КАК МЫ ОЦЕНИВАЕМ РЕЗУЛЬТАТ<\/p><h2>Не только<br/>охват и клики.<\/h2><\/div><div><p>Согласуем измеримые показатели ещё до начала работ: стоимость и качество обращений, динамика конверсии, объём квалифицированного спроса, вклад в продажи и прозрачность процессов. Метрики зависят от услуги, доступных данных и этапа развития проекта.<\/p><p>Если данные о продажах пока не передаются в аналитику, сначала устраняем этот пробел. Отчёты должны помогать принимать решения, а не просто выглядеть красиво.<\/p><\/div><\/div><\/div><\/section>\n<section class=\"section service-guides\"><div class=\"container\"><div class=\"section-head\"><div class=\"eyebrow\"><span class=\"dot\"><\/span> 04 / ПОДРОБНО ОБ УСЛУГЕ<\/div><div><h2>Разбираем инструменты\nи задачи бизнеса.<\/h2><p>Отвечаем на основные поисковые запросы без механического повторения ключевых слов.<\/p><\/div><\/div><div class=\"guide-grid\"><article class=\"guide-card\"><span>01 / НАПРАВЛЕНИЕ<\/span><h2>Что входит в SEO-продвижение сайта<\/h2><p>SEO сайта — это техническое качество, понятная архитектура, соответствие поисковому намерению, полезный контент и доверие к компании. Простая закупка текстов без изменения структуры редко решает проблему. Начинаем с аудита индексации, скорости, семантики и коммерческих факторов. Затем формируем приоритетный список работ и измеряем эффект по органическим обращениям и целевым запросам.<\/p><\/article><article class=\"guide-card\"><span>02 / НАПРАВЛЕНИЕ<\/span><h2>Технический SEO-аудит<\/h2><p>Проверяем доступность страниц для роботов, дубли, canonical, robots.txt, sitemap.xml, корректность ответов сервера, мобильный интерфейс и Core Web Vitals. Отдельно смотрим, что видит поисковик в исходном HTML и как меняются URL при редактировании. Приоритет получают проблемы, которые мешают индексации или существенным конверсиям.<\/p><\/article><article class=\"guide-card\"><span>03 / НАПРАВЛЕНИЕ<\/span><h2>SEO-блог и статьи для сайта<\/h2><p>Полезная статья отвечает на конкретный вопрос и помогает человеку принять решение. Ей нужны проверяемые факты, экспертное авторство, дата обновления и естественные внутренние ссылки на коммерческие страницы. Не следует создавать десятки почти одинаковых материалов только ради вхождений. Редакционный план формируем на основе реальной семантики и потребностей покупателей.<\/p><\/article><article class=\"guide-card\"><span>04 / НАПРАВЛЕНИЕ<\/span><h2>SEO для B2B и Яндекса<\/h2><p>В B2B особенно важны коммерческие страницы с ясным составом услуги, компетенциями, кейсами, контактами и возможностью обсуждения проекта. Для Яндек 01 / КОМУ ПОДХОДИТ<\/div><div><h2>Когда это\nименно ваша задача.<\/h2><p>Мы смотрим на ситуацию и бизнес-модель, а не подбираем услугу по шаблону.<\/p><\/div><\/div><div class=\"audience-grid\"><article><span class=\"tiny-index\">01<\/span><h3>B2B и производство<\/h3><p>Нужны сложные продуктовые страницы, кейсы и заявки от целевых компаний.<\/p><\/article><article><span class=\"tiny-index\">02<\/span><h3>Малый бизнес<\/h3><p>Нужен рабочий сайт под ключ без сложной редакции и дорогого сопровождения.<\/p><\/article><article><span class=\"tiny-index\">03<\/span><h3>Рекламные кампании<\/h3><p>Нужны отдельные лендинги, чтобы измерять эффективность гипотез.<\/p><\/article><article><span class=\"tiny-index\">04<\/span><h3>Корпоративные проекты<\/h3><p>Нужны авторство, роли, CMS, блог и масштабируемая архитектура.<\/p><\/article><\/div><\/div><\/section>\n<section class=\"section service-inside\"><div class=\"container\"><div class=\"section-head\"><div class=\"eyebrow\"><span class=\"dot\"><\/span> 02 / ЧТО ВХОДИТ<\/div><div><h2>Всё нужное.\nНичего лишнего.<\/h2><p>Фактический состав и границы работ фиксируем в коммерческом предложении.<\/p><\/div><\/div><div class=\"inside-grid\"><article class=\"inside-item\"><span>01<\/span><h3>Аналитика и прототип<\/h3><p>Изучаем ЦА, офферы, поиск и сценарии пользователя до дизайна.<\/p><div class=\"inside-cross\">↗<\/div><\/article><article class=\"inside-item\"><span>02<\/span><h3>UX/UI-дизайн<\/h3><p>Строим визуальную иерархию, мобильный интерфейс и понятную навигацию.<\/p><div class=\"inside-cross\">↗<\/div><\/article><article class=\"inside-item\"><span>03<\/span><h3>Лендинги<\/h3><p>Быстрые посадочные под отдельный продукт, предложение или рекламный трафик.<\/p><div class=\"inside-cross\">↗<\/div><\/article><article class=\"inside-item\"><span>04<\/span><h3>Корпоративные сайты<\/h3><p>Страницы услуг, кейсы, блог и архитектура, которую можно развивать.<\/p><div class=\"inside-cross\">↗<\/div><\/article><article class=\"inside-item\"><span>05<\/span><h3>Квизы и формы<\/h3><p>Упрощаем первичное обращение и сегментируем заявки.<\/p><div class=\"inside-cross\">↗<\/div><\/article><article class=\"inside-item\"><span>06<\/span><h3>SEO-фундамент<\/h3><p>Семантическая структура, метатеги, микроразметка, скорость и карта сайта.<\/p><div class=\"inside-cross\">↗<\/div><\/article><\/div><\/div><\/section>\n<section class=\"section dark-section\"><div class=\"container\"><div class=\"section-head\"><div class=\"eyebrow light\"><span class=\"dot\"><\/span> 03 / КАК РАБОТАЕМ<\/div><div><h2>От первой встречи<br/>до регулярной работы.<\/h2><p>Не прячем процесс за сложными терминами.<\/p><\/div><\/div><div class=\"timeline\"><div class=\"timeline-item\"><span>ШАГ 1<\/span><div><h3>Исследование<\/h3><p>Собираем требования, семантику и конверсионные сценарии.<\/p><\/div><span>↗<\/span><\/div><div class=\"timeline-item\"><span>ШАГ 2<\/span><div><h3>Прототип<\/h3><p>Создаём структуру блоков и согласуем тексты.<\/p><\/div><span>↗<\/span><\/div><div class=\"timeline-item\"><span>ШАГ 3<\/span><div><h3>Дизайн и код<\/h3><p>Собираем адаптивный интерфейс, шаблоны и SEO-разметку.<\/p><\/div><span>↗<\/span><\/div><div class=\"timeline-item\"><span>ШАГ 4<\/span><div><h3>Запуск<\/h3><p>Проверяем формы, скорость, события, индексацию и исправляем ошибки.<\/p><\/div><span>↗<\/span><\/div><\/div><div class=\"tools-row\"><strong>ТЕХНОЛОГИИ И ИНСТРУМЕНТЫ<\/strong><div><span>Figma<\/span><span>HTML/CSS<\/span><span>SSR / SSG<\/span><span>CMS<\/span><span>Яндекс.Метрика<\/span><span>Schema.org<\/span><\/div><\/div><\/div><\/section>\n<section class=\"section service-meaning\"><div class=\"container\"><div class=\"meaning-quote\"><div class=\"asterisk\">✳<\/div><div><span class=\"eyebrow\">НАШ ПОДХОД<\/span><p>«Сайт — не витрина ради витрины. Это понятный путь от вопроса клиента до разговора с вашей командой.»<\/p><\/div><\/div><div class=\"meaning-columns\"><div><p class=\"eyebrow\">КАК МЫ ОЦЕНИВАЕМ РЕЗУЛЬТАТ<\/p><h2>Не только<br/>охват и клики.<\/h2><\/div><div><p>Согласуем измеримые показатели ещё до начала работ: стоимость и качество обращений, динамика конверсии, объём квалифицированного спроса, вклад в продажи и прозрачность процессов. Метрики зависят от услуги, доступных данных и этапа развития проекта.<\/p><p>Если данные о продажах пока не передаются в аналитику, сначала устраняем этот пробел. Отчёты должны помогать принимать решения, а не просто выглядеть красиво.<\/p><\/div><\/div><\/div><\/section>\n<section class=\"section service-guides\"><div class=\"container\"><div class=\"section-head\"><div class=\"eyebrow\"><span class=\"dot\"><\/span> 04 / ПОДРОБНО ОБ УСЛУГЕ<\/div><div><h2>Разбираем инструменты\nи задачи бизнеса.<\/h2><p>Отвечаем на основные поисковые запросы без механического повторения ключевых слов.<\/p><\/div><\/div><div class=\"guide-grid\"><article class=\"guide-card\"><span>01 / НАПРАВЛЕНИЕ<\/span><h2>Лендинги для рекламы<\/h2><p>Лендинг под ключ создаётся под конкретный продукт и одно основное действие. Мы выстраиваем последовательность: проблема клиента, предложение, доказательства, состав услуги, ответы на вопросы и удобная форма. Текст и блоки должны соответствовать рекламному объявлению, иначе пользователь не понимает, куда попал. Конверсия зависит не только от оформления, но и от качества трафика, оффера и скорости обработки обращения.<\/p><\/article><article class=\"guide-card\"><span>02 / НАПРАВЛЕНИЕ<\/span><h2>Квизы для лидогенерации<\/h2><p>Квиз для сайта может упростить сложный запрос клиента: несколько вопросов помогают понять объём проекта, срок или нужную комплектацию. Но квиз не должен скрывать условия покупки или искусственно усложнять доступ к контактам. Мы используем короткие сценарии с понятной пользой, проверяем доступность на телефоне и измеряем не просто заполнение формы, а долю качественных обращений.<\/p><\/article><article class=\"guide-card\"><span>03 / НАПРАВЛЕНИЕ<\/span><h2>Сайты для B2B<\/h2><p>B2B-сайт должен объяснить сложный продукт нескольким участникам сделки. Поэтому важны отраслевые примеры, технические характеристики, условия поставки, кейсы и пути к связи с экспертом. При планировании учитываем семантику, структуру категорий и маршруты из поисковой выдачи на соответствующую услугу. Контент создаётся под вопросы аудитории, а не под механическое повторение запросов.<\/p><\/article><article class=\"guide-card\"><span>04 / НАПРАВЛЕНИЕ<\/span><h2>Корпоративные сайты с CMS<\/h2><p>Корпоративный сайт должен оставаться управляемым после релиза. Для этого нужны повторно используемые шаблоны, редактируемые метатеги, изображения, карточки и статьи, роли редакторов и рабочий процесс публикации. Важны сохранение URL при обновлении, 301-редиректы при переносе и резервное копирование. Выбираем CMS по задачам редакции и инфраструктуре, а не по количеству плагинов.<\/p><\/article><\/div><\/div><\/section>\n<section class=\"section service-proof\"><div class=\"container\"><div class=\"section-head\"><div class=\"eyebrow\"><span class=\"dot\"><\/span> 04 / ОПЫТ<\/div><div><h2>Реальный бизнес.\nРеальные задачи.<\/h2><p>Примеры из кейсов, опубликованных Expert Team на действующем сайте.<\/p><\/div><\/div><div class=\"service-case\"><div class=\"service-case-index\">ET / CASE 01<\/div><div><small>Финансовые услуги · B2B<\/small><h3>МФЦ «Моя Ипотека»<\/h3><p>С нуля выстроили маркетинг для привлечения целевых B2B-обращений в рамках согласованной стоимости лида.<\/p><a class=\"underlink\" href=\"/kejsy/mfc-moya-ipoteka/\">Подробнее о кейсе ↗<\/a><\/div><div class=\"service-case-metric\"><strong>≤ 450 ₽<\/strong><span>стоимость лида, указанная в кейсе<\/span><\/div><\/div><div class=\"service-price\"><div><span class=\"eyebrow\">ЦЕНА / ФОРМАТ<\/span><h2>Смета после брифа<\/h2><p>Подготовим оценку объёма работ и бюджета после короткого знакомства с задачей. Никаких скрытых обещаний и неутверждённых тарифов.<\/p><\/div><div><a class=\"underlink\" href=\"/ceny/\">Как формируется стоимость ↗<\/a><button class=\"btn btn-dark\" data-open-lead=\"\">Обсудить стоимость ↗<\/button><\/div><\/div><section class=\"lead-section\" id=\"lead-section\"><div aria-hidden=\"true\" class=\"lead-pattern\">✳<\/div><div class=\"lead-section-copy\"><p class=\"eyebrow\">БЕСПЛАТНО / БЕЗ ОБЯЗАТЕЛЬСТВ<\/p><h2>План роста<br/><em>вместо догадок.<\/em><\/h2><p>Разберём вашу задачу, покажем точки роста и предложим реалистичный план работ. Без обязательств на старте.<\/p><\/div><form class=\"lead-form lead-form-inline\" data-lead-form=\"\"><label class=\"sr-only\" for=\"leadPhone\">Номер телефона<\/label><div class=\"lead-inline-row\"><input autocomplete=\"tel\" id=\"leadPhone\" inputmode=\"tel\" maxlength=\"30\" minlength=\"8\" name=\"phone\" placeholder=\"Ваш номер телефона\" required=\"\" type=\"tel\"/><button class=\"btn btn-dark\" type=\"submit\">Получить план ↗<\/button><\/div><label class=\"checkline\"><input name=\"consent\" required=\"\" type=\"checkbox\"/><span>Согласен(а) на обработку персональных данных по <a href=\"/politika-konfidencialnosti/\">политике<\/a><\/span><\/label><p aria-live=\"polite\" class=\"form-status\" role=\"status\"><\/p><\/form><\/section><\/div><\/section>\n<section class=\"section faq-section\"><div class=\"container\"><div class=\"faq-columns\"><div><p class=\"eyebrow\"><span class=\"dot\"><\/span> 05 / FAQ<\/p><h2>Разбираем<br/><em>детали.<\/em><\/h2><p>Честно о формате работы, процессе и сроках.<\/p><\/div><div class=\"faq-list\"><details class=\"faq-item\"><summary><span class=\"faq-index\">01<\/span><span>Сколько стоит создание сайта?<\/span><span class=\"faq-plus\">+<\/span><\/summary><div class=\"faq-answer\">Стоимость зависит от типа проекта, количества шаблонов, интеграций и подготовки контента. После брифа предоставляем этапную смету.<\/div><\/details><details class=\"faq-item\"><summary><span class=\"faq-index\">02<\/span><span>Чем лендинг отличается от многостраничного сайта?<\/span><span class=\"faq-plus\">+<\/span><\/summary><div class=\"faq-answer\">Лендинг for (const r of [...topRoutes,...routes.filter(x=>!topRoutes.includes(x))]){
  if(!DATA.pages[r])continue;
  const option=document.createElement('option'); option.value=r;
  option.textContent=r==='/'?'Главная':r.startsWith('/uslugi/')?r.split('/')[2].replaceAll('-',' '):r.replace(/^\/|\/$/g,'');
  sel.appendChild(option);
}
function path(){let v=location.hash.slice(1).split('?')[0]||'/';if(v==='/'||!v)return '/';if(!v.startsWith('/'))return '/';return v.endsWith('/')?v:v+'/';}
function route(){let to=path();if(!DATA.pages[to])to='/404/' in DATA.pages?'/404/':'/';
  root.innerHTML=DATA.pages[to];document.title=DATA.titles[to]+' · Макет';
  const src=DATA.classes[to];try{document.body.className=JSON.parse(src.replaceAll("'",'"')).join(' ');}catch(e){document.body.className='';}
  sel.value=to;window.scrollTo({top:0,behavior:'instant'});document.body.style.overflow='';
  const banner=document.getElementById('slideBanner');if(banner)banner.hidden=true;
  document.querySelectorAll('[data-lead-form] .form-status').forEach(x=>x.textContent='');
  updateProgress();
}
sel.addEventListener('change',e=>location.hash='#'+e.target.value);
document.getElementById('review-home').addEventListener('click',()=>location.hash='#/');

document.addEventListener('click',e=>{
 const a=e.target.closest('a[href]');
 if(a){const href=a.getAttribute('href');if(href.startsWith('/')&&!href.startsWith('//')){e.preventDefault();let to=href.split('#')[0].split('?')[0];to=to.endsWith('/')?to:to+'/';location.hash='#'+to; if(path()===to)route();return;}}
 if(e.target.closest('[data-open-lead]')){const dlg=document.getElementById('leadDialog'); if(dlg){dlg.showModal();document.body.style.overflow='hidden';dlg.querySelector('input[type=tel]')?.focus();}return;}
 if(e.target.closest('[data-close-lead]')){document.getElementById('leadDialog')?.close();document.body.style.overflow='';return;}
 const toggle=e.target.closest('.mobile-toggle');
 if(toggle){const menu=document.getElementById('mobileMenu');if(menu){menu.hidden=!menu.hidden; toggle.setAttribute('aria-expanded',String(!menu.hidden));document.body.style.overflow=menu.hidden?'':'hidden';}return;}
 const drop=e.target.closest('.nav-dropdown-trigger');
 if(drop){const nav=drop.closest('.nav-dropdown');const open=nav.classList.toggle('open');drop.setAttribute('aria-expanded',String(open));return;}
 document.querySelector('.nav-dropdown')?.classList.remove('open');
 if(e.target.id==='leadDialog'){e.target.close();document.body.style.overflow='';}
});
document.addEventListener('submit',e=>{

 e.preventDefault();const p=form.querySelector('input[name=phone]');const c=form.querySelector('input[name=consent]');if(!p?.checkValidity()){p?.reportValidity();return;}if(!c?.checked){c?.reportValidity();return;}
 form.querySelector('.form-status').textContent='Это демонстрация. Заявка не отправлена.';
});
