<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Expert Team — редактор сайта</title>
<style>
  body{margin:0;font:500 15px/1.65 system-ui,sans-serif;background:#111410;color:#f4f7ed;min-height:100vh}
  .setup{max-width:650px;margin:10vh auto;padding:36px;border:1px solid #404b37;border-radius:14px;background:#1c221b}
  h1{font-size:26px;line-height:1.3}strong{color:#d5ff45}.info{color:#c4cbbd}
  code{background:#2b3328;border-radius:5px;padding:2px 6px}
  .kicker{font-size:11px;color:#d5ff45;letter-spacing:.18em;text-transform:uppercase}
  a{color:#d5ff45}
</style>
</head>
<body>
<div class="setup" id="setup" role="status">
  <div class="kicker">EXPERT TEAM / CONTENT MANAGER</div>
  <h1>Проверяем подключение редактора…</h1>
  <p class="info">Для изменения сайта через браузер нужны репозиторий GitHub и авторизация. Без подключения система не сохраняет файлы.</p>
</div>
<script>
(async()=>{
 const box=document.getElementById('setup');
 try{
   const response=await fetch('./config.yml',{cache:'no-store'});
   if(!response.ok)throw Error('config.yml недоступен');
   const cfg=await response.text();
   if(cfg.includes('YOUR_ORG/YOUR_REPO')){
      box.innerHTML='<div class="kicker">EXPERT TEAM / CONTENT MANAGER</div><h1>Редактор пока <strong>не подключён</strong></h1><p class="info">CMS уже подготовлена в исходниках, но для входа нужно указать репозиторий и настроить OAuth либо Decap Turbo. Файлы сайта при этом не меняются.</p><p>Инструкция: <code>docs/CMS_SETUP.md</code> в архиве проекта.</p>';
      return;
   }
   const script=document.createElement('script');
   script.src='https://unpkg.com/decap-cms@^3.17.0/dist/decap-cms.js';
   script.onload=()=>box.remove();
   script.onerror=()=>{box.querySelector('h1').textContent='Не удалось загрузить интерфейс CMS';};
   document.body.appendChild(script);
 }catch(_e){
   box.innerHTML='<div class="kicker">EXPERT TEAM / CONTENT MANAGER</div><h1>Откройте CMS на <strong>опубликованном тестовом сайте</strong></h1><p class="info">Для работы редактора нужен HTTP/HTTPS-сервер, подключение к GitHub и авторизация. Локальный HTML-файл предназначен только для просмотра дизайна.</p>';
 }
})();
</script>
</body>
</html>
