<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Expert Team — редактор сайта</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.7 Manrope,Arial,sans-serif;background:#F1F4FF;color:#1B1B1B;padding:20px}.panel{max-width:680px;background:#fff;border:1px solid #DCE1FA;padding:clamp(26px,5vw,55px);border-radius:20px;box-shadow:0 30px 70px #08056b0c}.eyebrow{color:#0F09FF;font:800 12px/1.3 Arial,sans-serif;letter-spacing:.14em}h1{font-size:clamp(30px,5vw,45px);line-height:1.12;letter-spacing:-.05em}strong{color:#0F09FF}p{color:#666A79}a{color:#0F09FF;font-weight:bold}code{font-size:12px;background:#EEF2FF;padding:4px 7px;border-radius:5px}</style></head><body><main class="panel" id="setup"><div class="eyebrow">EXPERT TEAM / CMS</div><h1>Проверяем конфигурацию редактора…</h1><p>Для реального сохранения изменений нужна настроенная авторизация GitHub через OAuth/проверенный сервис.</p></main><script>(async()=>{const b=document.getElementById('setup');try{const r=await fetch('config.yml',{cache:'no-store'});if(!r.ok)throw Error('config missing');const c=await r.text();if(!/^cms_auth_ready:\s*true\s*$/mi.test(c)){b.innerHTML='<div class="eyebrow">EXPERT TEAM / CMS</div><h1>Редактор подготовлен.<br><strong>Авторизация ещё не подключена.</strong></h1><p>Сайт собирается из редактируемых JSON/Markdown-файлов. Вход и сохранение через браузер включим после настройки безопасной авторизации GitHub. Это не ошибка размещения сайта.</p><p>Инструкция: <code>docs/CMS_REDIRECT_2026.md</code> в архиве проекта.</p><p><a href="/">← Вернуться на сайт</a></p>';return;}const s=document.createElement('script');s.src='https://unpkg.com/decap-cms@^3.17.0/dist/decap-cms.js';s.onerror=()=>b.innerHTML='<h1>Не удалось загрузить редактор</h1><p>Проверьте доступность Decap CMS.</p>';s.onload=()=>b.remove();document.body.appendChild(s)}catch(e){b.innerHTML='<h1>CMS требует публикации на сервере</h1><p>Локальный HTML работает как демонстрация дизайна. Для редактирования нужна работающая авторизация.</p>'}})();</script></body></html>
